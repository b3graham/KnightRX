services:
  backyard-box:
    build: .
    container_name: backyard-box
    restart: unless-stopped
    environment:
      - APP_NAME=Knight RX
    # Bind to localhost only — Caddy is the public entrance and adds basic auth.
    ports:
      - "127.0.0.1:8110:8000"
    volumes:
      - ./data:/data
